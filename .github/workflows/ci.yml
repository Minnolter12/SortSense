name: SortSense CI & Release Build

on:
  push:
    branches:
      - main
      - fix/sortsense-regression-restoration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python 3.11)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (non-GUI, non-Ollama)
        run: |
          py -m pytest -q --ignore=tests/smoke_test_live.py

  build-windows:
    name: Windows Desktop Packaging
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PyInstaller distribution
        run: |
          pyinstaller sortsense.spec --noconfirm

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortSense-Windows-exe
          path: dist/SortSense/
          if-no-files-found: error
